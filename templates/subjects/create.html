{% extends 'base.html' %}
{% block title %}Create Subject – MCQ Examiner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('subjects.list_subjects') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0"><i class="bi bi-plus-circle text-primary me-2"></i>New Subject</h2>
        </div>
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('subjects.create_subject') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label for="name" class="form-label fw-semibold">Subject Name</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name"
                               placeholder="e.g. Biology, Chemistry A-Level" required autofocus>
                        <div class="form-text">This name will appear on all tests for this subject.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-lg me-1"></i>Create Subject
                        </button>
                        <a href="{{ url_for('subjects.list_subjects') }}" class="btn btn-outline-secondary btn-lg">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
